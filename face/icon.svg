<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" shape-rendering="crispEdges">
  <defs>
    <filter id="icon-cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f3ff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep cyber background -->
  <rect width="192" height="192" rx="42" fill="#030712"/>
  <rect x="6" y="6" width="180" height="180" rx="38" fill="#06111e" stroke="#00f3ff" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Subtle corner cyber accents -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#00f3ff" stroke-width="3"/>
  <path d="M 176 36 L 176 16 L 156 16" fill="none" stroke="#00f3ff" stroke-width="3"/>
  <path d="M 16 156 L 16 176 L 36 176" fill="none" stroke="#00f3ff" stroke-width="3"/>
  <path d="M 176 156 L 176 176 L 156 176" fill="none" stroke="#00f3ff" stroke-width="3"/>

  <!-- Face Emotes with Cyan Glow -->
  <g filter="url(#icon-cyan-glow)">
    <!-- Left Pixel Eye -->
    <rect x="52" y="48" width="20" height="6" fill="#00f3ff"/>
    <rect x="46" y="54" width="32" height="36" fill="#00f3ff"/>
    <rect x="52" y="90" width="20" height="6" fill="#00f3ff"/>
    <!-- Glint -->
    <rect x="52" y="54" width="10" height="10" fill="#ffffff"/>

    <!-- Right Pixel Eye -->
    <rect x="120" y="48" width="20" height="6" fill="#00f3ff"/>
    <rect x="114" y="54" width="32" height="36" fill="#00f3ff"/>
    <rect x="120" y="90" width="20" height="6" fill="#00f3ff"/>
    <!-- Glint -->
    <rect x="120" y="54" width="10" height="10" fill="#ffffff"/>

    <!-- Cyber Cheek Ticks -->
    <rect x="28" y="98" width="10" height="3" fill="#00f3ff" opacity="0.6"/>
    <rect x="154" y="98" width="10" height="3" fill="#00f3ff" opacity="0.6"/>

    <!-- Pixel Smile -->
    <rect x="74" y="118" width="6" height="6" fill="#00f3ff"/>
    <rect x="112" y="118" width="6" height="6" fill="#00f3ff"/>
    <rect x="80" y="124" width="6" height="6" fill="#00f3ff"/>
    <rect x="106" y="124" width="6" height="6" fill="#00f3ff"/>
    <rect x="86" y="130" width="20" height="6" fill="#00f3ff"/>
  </g>
</svg>
