<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ZMO Face</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="face.css" />
</head>
<body class="state-idle emotion-happy mode-laptop">
  <main id="zmo-shell" title="Tap to toggle fullscreen">
    <section id="zmo-screen" aria-label="ZMO Futuristic Face Display">
      <!-- Minimal Futuristic Cyber HUD (No intrusive buttons) -->
      <header id="cyber-hud">
        <div class="hud-item hud-left">
          <span class="hud-bracket">[</span><span class="hud-id">ZMO // CORE</span><span class="hud-bracket">]</span>
        </div>
        <div class="hud-item hud-center">
          <div id="hud-waveform" aria-hidden="true">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </div>
        </div>
        <div class="hud-item hud-right">
          <span id="hud-status" class="hud-status">ONLINE</span>
        </div>
      </header>

      <!-- Futuristic Pixel Art Face Canvas -->
      <div id="face-stage">
        <svg id="zmo-face-svg" viewBox="0 0 160 110" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges">
          <defs>
            <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00f3ff" flood-opacity="0.9" />
              <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f3ff" flood-opacity="0.5" />
            </filter>
            <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00f3ff" flood-opacity="0.6" />
            </filter>
          </defs>

          <!-- ==================== LEFT EYE ==================== -->
          <g id="left-eye-group" class="eye-group" filter="url(#cyan-glow)">
            <!-- Normal / Default Eye -->
            <g class="eye-variant eye-normal">
              <!-- Row 0 -->
              <rect x="40" y="24" width="16" height="4" fill="#00f3ff" />
              <!-- Rows 1 to 6 (full body) -->
              <rect x="36" y="28" width="24" height="24" fill="#00f3ff" />
              <!-- Row 7 -->
              <rect x="40" y="52" width="16" height="4" fill="#00f3ff" />
              <!-- White/Cyan Pixel Glint -->
              <rect x="40" y="28" width="8" height="8" fill="#ffffff" />
            </g>

            <!-- Blinking Eye -->
            <g class="eye-variant eye-blink">
              <rect x="36" y="38" width="24" height="4" fill="#00f3ff" />
            </g>

            <!-- Happy Eye (^ arch) -->
            <g class="eye-variant eye-happy">
              <rect x="44" y="26" width="8" height="4" fill="#00f3ff" />
              <rect x="40" y="30" width="4" height="4" fill="#00f3ff" />
              <rect x="52" y="30" width="4" height="4" fill="#00f3ff" />
              <rect x="36" y="34" width="4" height="6" fill="#00f3ff" />
              <rect x="56" y="34" width="4" height="6" fill="#00f3ff" />
            </g>

            <!-- Excited Eye (Wide block with cyber flares) -->
            <g class="eye-variant eye-excited">
              <rect x="40" y="22" width="16" height="4" fill="#00f3ff" />
              <rect x="36" y="26" width="24" height="26" fill="#00f3ff" />
              <rect x="40" y="52" width="16" height="4" fill="#00f3ff" />
              <rect x="40" y="26" width="8" height="8" fill="#ffffff" />
              <!-- Corner flare pixels -->
              <rect x="30" y="24" width="4" height="4" fill="#00f3ff" />
              <rect x="62" y="24" width="4" height="4" fill="#00f3ff" />
            </g>

            <!-- Sleepy Eye (Flat cyber dash) -->
            <g class="eye-variant eye-sleepy">
              <rect x="36" y="44" width="24" height="4" fill="#00f3ff" />
            </g>

            <!-- Sad Eye (Angled down) -->
            <g class="eye-variant eye-sad">
              <rect x="36" y="32" width="8" height="4" fill="#00f3ff" />
              <rect x="44" y="36" width="8" height="4" fill="#00f3ff" />
              <rect x="52" y="40" width="8" height="6" fill="#00f3ff" />
            </g>

            <!-- Surprised Eye (Hollow cyber square [ ]) -->
            <g class="eye-variant eye-surprised">
              <rect x="36" y="24" width="24" height="4" fill="#00f3ff" />
              <rect x="36" y="52" width="24" height="4" fill="#00f3ff" />
              <rect x="36" y="28" width="4" height="24" fill="#00f3ff" />
              <rect x="56" y="28" width="4" height="24" fill="#00f3ff" />
            </g>

            <!-- Thinking Eye (Shifted upper-right) -->
            <g class="eye-variant eye-thinking">
              <rect x="42" y="20" width="18" height="4" fill="#00f3ff" />
              <rect x="40" y="24" width="22" height="20" fill="#00f3ff" />
              <rect x="42" y="44" width="18" height="4" fill="#00f3ff" />
              <rect x="44" y="24" width="8" height="8" fill="#ffffff" />
            </g>
          </g>

          <!-- ==================== RIGHT EYE ==================== -->
          <g id="right-eye-group" class="eye-group" filter="url(#cyan-glow)">
            <!-- Normal / Default Eye -->
            <g class="eye-variant eye-normal">
              <!-- Row 0 -->
              <rect x="104" y="24" width="16" height="4" fill="#00f3ff" />
              <!-- Rows 1 to 6 (full body) -->
              <rect x="100" y="28" width="24" height="24" fill="#00f3ff" />
              <!-- Row 7 -->
              <rect x="104" y="52" width="16" height="4" fill="#00f3ff" />
              <!-- White/Cyan Pixel Glint -->
              <rect x="104" y="28" width="8" height="8" fill="#ffffff" />
            </g>

            <!-- Blinking Eye -->
            <g class="eye-variant eye-blink">
              <rect x="100" y="38" width="24" height="4" fill="#00f3ff" />
            </g>

            <!-- Happy Eye (^ arch) -->
            <g class="eye-variant eye-happy">
              <rect x="108" y="26" width="8" height="4" fill="#00f3ff" />
              <rect x="104" y="30" width="4" height="4" fill="#00f3ff" />
              <rect x="116" y="30" width="4" height="4" fill="#00f3ff" />
              <rect x="100" y="34" width="4" height="6" fill="#00f3ff" />
              <rect x="120" y="34" width="4" height="6" fill="#00f3ff" />
            </g>

            <!-- Excited Eye (Wide block with cyber flares) -->
            <g class="eye-variant eye-excited">
              <rect x="104" y="22" width="16" height="4" fill="#00f3ff" />
              <rect x="100" y="26" width="24" height="26" fill="#00f3ff" />
              <rect x="104" y="52" width="16" height="4" fill="#00f3ff" />
              <rect x="104" y="26" width="8" height="8" fill="#ffffff" />
              <!-- Corner flare pixels -->
              <rect x="94" y="24" width="4" height="4" fill="#00f3ff" />
              <rect x="126" y="24" width="4" height="4" fill="#00f3ff" />
            </g>

            <!-- Sleepy Eye (Flat cyber dash) -->
            <g class="eye-variant eye-sleepy">
              <rect x="100" y="44" width="24" height="4" fill="#00f3ff" />
            </g>

            <!-- Sad Eye (Angled down) -->
            <g class="eye-variant eye-sad">
              <rect x="116" y="32" width="8" height="4" fill="#00f3ff" />
              <rect x="108" y="36" width="8" height="4" fill="#00f3ff" />
              <rect x="100" y="40" width="8" height="6" fill="#00f3ff" />
            </g>

            <!-- Surprised Eye (Hollow cyber square [ ]) -->
            <g class="eye-variant eye-surprised">
              <rect x="100" y="24" width="24" height="4" fill="#00f3ff" />
              <rect x="100" y="52" width="24" height="4" fill="#00f3ff" />
              <rect x="100" y="28" width="4" height="24" fill="#00f3ff" />
              <rect x="120" y="28" width="4" height="24" fill="#00f3ff" />
            </g>

            <!-- Thinking Eye (Shifted upper-right) -->
            <g class="eye-variant eye-thinking">
              <rect x="106" y="20" width="18" height="4" fill="#00f3ff" />
              <rect x="104" y="24" width="22" height="20" fill="#00f3ff" />
              <rect x="106" y="44" width="18" height="4" fill="#00f3ff" />
              <rect x="108" y="24" width="8" height="8" fill="#ffffff" />
            </g>
          </g>

          <!-- ==================== SUBTLE CYBER CHEEK TICKS ==================== -->
          <g id="cyber-cheeks" filter="url(#subtle-glow)">
            <!-- Left cheek dashes -->
            <rect x="22" y="60" width="8" height="2" fill="#00f3ff" class="cheek-tick" />
            <rect x="22" y="64" width="6" height="2" fill="#00f3ff" class="cheek-tick" />
            <!-- Right cheek dashes -->
            <rect x="130" y="60" width="8" height="2" fill="#00f3ff" class="cheek-tick" />
            <rect x="132" y="64" width="6" height="2" fill="#00f3ff" class="cheek-tick" />
          </g>

          <!-- ==================== MOUTH VARIANTS ==================== -->
          <g id="mouth-group" filter="url(#cyan-glow)">
            <!-- Normal Smile (Pixel smile) -->
            <g class="mouth-variant mouth-smile">
              <rect x="62" y="74" width="4" height="4" fill="#00f3ff" />
              <rect x="94" y="74" width="4" height="4" fill="#00f3ff" />
              <rect x="66" y="78" width="4" height="4" fill="#00f3ff" />
              <rect x="90" y="78" width="4" height="4" fill="#00f3ff" />
              <rect x="70" y="82" width="20" height="4" fill="#00f3ff" />
            </g>

            <!-- Excited Wide Open Smile -->
            <g class="mouth-variant mouth-excited">
              <rect x="60" y="72" width="40" height="4" fill="#00f3ff" />
              <rect x="60" y="76" width="4" height="8" fill="#00f3ff" />
              <rect x="96" y="76" width="4" height="8" fill="#00f3ff" />
              <rect x="64" y="84" width="32" height="4" fill="#00f3ff" />
              <!-- Cyber teeth pixel dashes inside -->
              <rect x="68" y="76" width="4" height="4" fill="#ffffff" />
              <rect x="76" y="76" width="4" height="4" fill="#ffffff" />
              <rect x="84" y="76" width="4" height="4" fill="#ffffff" />
            </g>

            <!-- Talking Animated Cyber Equalizer Bars -->
            <g class="mouth-variant mouth-talking">
              <rect class="eq-bar eq-1" x="58" y="70" width="4" height="16" fill="#00f3ff" />
              <rect class="eq-bar eq-2" x="65" y="66" width="4" height="22" fill="#00f3ff" />
              <rect class="eq-bar eq-3" x="72" y="62" width="4" height="28" fill="#00f3ff" />
              <rect class="eq-bar eq-4" x="78" y="60" width="4" height="32" fill="#ffffff" />
              <rect class="eq-bar eq-5" x="84" y="62" width="4" height="28" fill="#00f3ff" />
              <rect class="eq-bar eq-6" x="91" y="66" width="4" height="22" fill="#00f3ff" />
              <rect class="eq-bar eq-7" x="98" y="70" width="4" height="16" fill="#00f3ff" />
            </g>

            <!-- Sad Frown (Inverted pixel curve) -->
            <g class="mouth-variant mouth-sad">
              <rect x="68" y="76" width="24" height="4" fill="#00f3ff" />
              <rect x="64" y="80" width="4" height="4" fill="#00f3ff" />
              <rect x="92" y="80" width="4" height="4" fill="#00f3ff" />
              <rect x="60" y="84" width="4" height="4" fill="#00f3ff" />
              <rect x="96" y="84" width="4" height="4" fill="#00f3ff" />
            </g>

            <!-- Surprised O (Pixel square mouth) -->
            <g class="mouth-variant mouth-surprised">
              <rect x="72" y="72" width="16" height="4" fill="#00f3ff" />
              <rect x="72" y="86" width="16" height="4" fill="#00f3ff" />
              <rect x="70" y="76" width="4" height="10" fill="#00f3ff" />
              <rect x="86" y="76" width="4" height="10" fill="#00f3ff" />
            </g>

            <!-- Sleepy / Quiet (Small flat dash) -->
            <g class="mouth-variant mouth-sleepy">
              <rect x="74" y="80" width="12" height="4" fill="#00f3ff" />
            </g>

            <!-- Thinking / Smirk (Offset pixel line) -->
            <g class="mouth-variant mouth-thinking">
              <rect x="76" y="78" width="18" height="4" fill="#00f3ff" />
              <rect x="94" y="74" width="4" height="4" fill="#00f3ff" />
            </g>

            <!-- Neutral (Flat line) -->
            <g class="mouth-variant mouth-neutral">
              <rect x="70" y="80" width="20" height="4" fill="#00f3ff" />
            </g>
          </g>
        </svg>
      </div>

      <!-- Corner cyber accent brackets -->
      <div class="cyber-bracket-tl"></div>
      <div class="cyber-bracket-tr"></div>
      <div class="cyber-bracket-bl"></div>
      <div class="cyber-bracket-br"></div>
    </section>
  </main>

  <script src="face.js"></script>
</body>
</html>
